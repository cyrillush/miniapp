<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>사고약도</title>
<meta name="description" content="손가락으로 그리는 사고약도 — 갤러리 사진 또는 도로 도면 위에 차량·충돌·진행방향을 배치해 PNG·A4로 저장" />
<meta name="theme-color" content="#F4F7FB" id="metaTheme" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="사고약도" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body data-theme="A" data-mode="road" data-btnsz="md">

<div id="appShell">
  <!-- 상단 편집 영역 (약도 캔버스와 완전 분리) -->
  <header id="topBarWrap">
    <div id="topbar">
      <button id="brandTap" class="brand" type="button" aria-label="사고약도">
        <span class="bmark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 19.2 9.4 5.2l5.2 8.6 5.4-3.6-2 9z"/><circle cx="9.4" cy="5.2" r="2.1"/></svg>
        </span>
        <span class="bname">사고약도</span>
      </button>
      <div class="topacts">
        <button id="btnPen" class="gl" type="button" aria-pressed="false" aria-label="그리기 켜기/끄기">
          <svg viewBox="0 0 24 24"><path d="M16.4 4.6 19.4 7.6 9.2 17.8 4.8 19.2l1.4-4.4z"/><path d="M14.2 6.8 17.2 9.8"/></svg>
          <em>그리기</em>
        </button>
      </div>
    </div>

    <!-- 딱 두 가지 배경 — 도로 도면 / 갤러리 사진 -->
    <div id="modeSeg" role="tablist" aria-label="약도 배경">
      <button type="button" role="tab" data-mode="road" class="on" aria-selected="true">
        <svg viewBox="0 0 24 24"><path d="M7.6 3.6v16.8M16.4 3.6v16.8" stroke-dasharray="4 3.4"/><path d="M3.4 4.6h17.2M3.4 19.4h17.2"/></svg>
        <span>도로</span>
      </button>
      <button type="button" role="tab" data-mode="photo" aria-selected="false">
        <svg viewBox="0 0 24 24"><rect x="3.2" y="5" width="17.6" height="14" rx="2.6"/><circle cx="8.6" cy="9.8" r="1.9"/><path d="m4.4 17.2 4.9-4 4.6 4.1 2.7-2.4 3 3.1"/></svg>
        <span>사진</span>
      </button>
    </div>

    <!-- 사진 모드 전용 줄 -->
    <div id="photoBar" hidden>
      <button id="btnPhotoLock" class="pchip" type="button" aria-pressed="true">
        <svg class="ic-unlock" viewBox="0 0 24 24"><rect x="4.6" y="10.6" width="14.8" height="9.4" rx="2.6"/><path d="M8.2 10.6V8.1a3.8 3.8 0 0 1 7-2.1"/></svg>
        <svg class="ic-lock" viewBox="0 0 24 24"><rect x="4.6" y="10.6" width="14.8" height="9.4" rx="2.6"/><path d="M8.2 10.6V8.1a3.8 3.8 0 0 1 7.6 0v2.5"/></svg>
        <em id="photoLockTxt">사진 고정</em>
      </button>
      <button id="btnPhotoFit" class="pchip" type="button">
        <svg viewBox="0 0 24 24"><path d="M4.4 9.2V5.4a1 1 0 0 1 1-1h3.8M14.8 4.4h3.8a1 1 0 0 1 1 1v3.8M19.6 14.8v3.8a1 1 0 0 1-1 1h-3.8M9.2 19.6H5.4a1 1 0 0 1-1-1v-3.8"/></svg>
        <em>맞춤</em>
      </button>
      <button id="capSwap" class="pchip" type="button">
        <svg viewBox="0 0 24 24"><rect x="3.4" y="5.4" width="17.2" height="13.2" rx="2.4"/><path d="M3.4 9.4h17.2M8 5.4v-2h8v2"/></svg>
        <em>사진 교체</em>
      </button>
    </div>
  </header>

  <!-- 중앙 순수 약도 캔버스 (버튼에 가리지 않음) -->
  <main id="stage">
    <div id="roadLayer" hidden></div>
    <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g id="world">
        <image id="photoImg" href="" preserveAspectRatio="xMidYMid slice" x="0" y="0" width="390" height="640" visibility="hidden"></image>
        <g id="artLayer"></g>
      </g>
    </svg>

    <div id="emptyPhoto" hidden>
      <button id="btnPickPhoto" class="pickcta" type="button">
        <svg viewBox="0 0 24 24"><rect x="3.2" y="5" width="17.6" height="14" rx="2.6"/><circle cx="8.6" cy="9.8" r="1.9"/><path d="m4.4 17.2 4.9-4 4.6 4.1 2.7-2.4 3 3.1"/></svg>
        <b>갤러리에서 사진 불러오기</b>
        <span>사진을 깔고 그 위에 차량·충격·진행방향을 그립니다</span>
      </button>
    </div>

    <svg id="holdRing" viewBox="0 0 56 56" hidden aria-hidden="true"><circle class="bg" cx="28" cy="28" r="22"/><circle class="fg" cx="28" cy="28" r="22"/></svg>
    <div id="sel">
      <div class="selbox"></div>
      <button class="hnd rot" type="button" aria-label="회전"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.4 4.4v4.2h-4.2"/></svg></button>
      <button class="hnd size" type="button" aria-label="크기"><svg viewBox="0 0 24 24"><path d="M4.6 19.4 19.4 4.6"/><path d="M13 4.6h6.4v6.4"/><path d="M4.6 13v6.4H11"/></svg></button>
      <div class="angle" hidden>0°</div>
    </div>
    <div id="chipRot" hidden>0°</div>
    <button id="toolChip" type="button" hidden aria-live="polite"></button>
  </main>

  <!-- 하단 편집 영역 (약도 캔버스와 완전 분리) -->
  <footer id="bottomWrap">
    <div id="selBar" hidden>
      <button class="sb" data-act="zin" type="button" aria-label="작게">−</button>
      <button class="sb wide" data-act="zout" type="button" aria-label="크게">+</button>
      <button class="sb arrowbtn" id="btnPenArrow" data-act="arrow" type="button" hidden>↗ 화살표</button>
      <div class="sbsep"></div>
      <div class="roles" id="roleSeg"></div>
      <div class="sbsep" id="roleSep"></div>
      <button class="sb" data-act="dup" type="button" aria-label="복제">
        <svg viewBox="0 0 24 24"><rect x="8.4" y="8.4" width="11.2" height="11.2" rx="2.4"/><path d="M15.6 5.4H6.6a1.2 1.2 0 0 0-1.2 1.2v9"/></svg>
      </button>
      <button class="sb danger" data-act="del" type="button" aria-label="삭제">
        <svg viewBox="0 0 24 24"><path d="M4.8 6.8h14.4M9.4 6.8V4.4h5.2v2.4M6.6 6.8l.9 12.4h9l.9-12.4"/><path d="M10.2 10.4v5.4M13.8 10.4v5.4"/></svg>
      </button>
      <button class="sb szbtn" id="btnSize" type="button" aria-label="요소 조작 버튼 크기">버튼 보통</button>
      <div class="selinfo" id="selInfo"></div>
    </div>

    <div id="dock">
      <button class="dk" type="button" data-cat="road">
        <svg viewBox="0 0 24 24"><path d="M7.6 3.6v16.8M16.4 3.6v16.8" stroke-dasharray="4 3.4"/><path d="M3.4 4.6h17.2M3.4 19.4h17.2"/></svg>
        <span>도로</span>
      </button>
      <button class="dk" type="button" data-cat="car">
        <svg viewBox="0 0 24 24"><path d="M5.4 15.1v-2.4l1.5-3.8a2.2 2.2 0 0 1 2-1.4h6.2a2.2 2.2 0 0 1 2 1.4l1.5 3.8v2.4"/><path d="M4.2 15.1h15.6"/><circle cx="8" cy="17.1" r="1.6"/><circle cx="16" cy="17.1" r="1.6"/></svg>
        <span>차량</span>
      </button>
      <button class="dk" type="button" data-cat="person">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5.6" r="2.6"/><path d="M12 8.8c-2.3 0-3.7 1.6-3.7 3.9v3.1h1.8v4.9h3.8v-4.9h1.8v-3.1c0-2.3-1.4-3.9-3.7-3.9Z"/></svg>
        <span>사람</span>
      </button>
      <button class="dk" type="button" data-cat="dmg">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" stroke-dasharray="3.2 2.5"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
        <span>파손</span>
      </button>
      <button class="dk" type="button" data-cat="etc">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><circle cx="16.8" cy="16.8" r="3.4"/></svg>
        <span>기타</span>
      </button>
      <button class="dk" type="button" data-cat="draw">
        <svg viewBox="0 0 24 24"><path d="M16.4 4.6 19.4 7.6 9.2 17.8 4.8 19.2l1.4-4.4z"/><path d="M14.2 6.8 17.2 9.8"/></svg>
        <span>그리기</span>
      </button>
      <div class="dksep"></div>
      <button class="dk act" type="button" id="btnClear" aria-label="화면 요소 전체 초기화">
        <svg viewBox="0 0 24 24"><path d="M4.4 15.4 12 7.8l5.2 5.2-7.6 7.6H8z"/><path d="M9.4 10.8 14.8 16.2"/><path d="M13.6 20.8h6.2"/></svg>
        <span>초기화</span>
      </button>
      <button class="dk act" type="button" id="btnUndo" aria-label="실행취소">
        <svg viewBox="0 0 24 24"><path d="M9.2 14.6 4.4 9.8l4.8-4.8"/><path d="M4.4 9.8h9.2a5.9 5.9 0 0 1 0 11.8H9.6"/></svg>
      </button>
      <button class="dk save" type="button" id="btnSave">
        <svg viewBox="0 0 24 24"><path d="M12 4.2v10.4"/><path d="m7.8 10.4 4.2 4.2 4.2-4.2"/><path d="M4.6 18.6h14.8"/></svg>
        <span>저장</span>
      </button>
    </div>
  </footer>
</div>

<!-- 피커 시트 -->
<section id="sheet" aria-hidden="true">
  <div class="sheetwrap">
    <div class="grip"></div>
    <header>
      <div>
        <h2 id="sheetTitle">차량</h2>
        <p id="sheetSub">항목을 눌러 약도에 놓으세요</p>
      </div>
      <button id="sheetClose" class="xbtn" type="button" aria-label="닫기">✕</button>
    </header>
    <div id="sheetRole" class="roles big" hidden></div>
    <div id="sheetBody"></div>
  </div>
</section>

<!-- 모달(저장·테마·PNG) -->
<div id="modal" hidden>
  <div class="mscrim" data-close="1"></div>
  <div class="mwrap" id="modalBody"></div>
</div>

<!-- 메모 입력 -->
<div id="memoWrap" hidden>
  <div class="memopanel">
    <input id="memoInput" type="text" maxlength="30" placeholder="메모 (예: 1차로 추돌)" />
    <button id="memoOk" type="button">확인</button>
  </div>
</div>

<div id="toast" hidden></div>
<div id="printArea" aria-hidden="true"></div>
<input id="fileInput" type="file" accept="image/*" hidden />

<script src="js/art3.js"></script>
<script src="js/elements.js"></script>
<script src="js/roads.js"></script>
<script src="js/sprites.js"></script>
<script src="js/core.js"></script>
<script src="js/viewx.js"></script>
<script src="js/objs.js"></script>
<script src="js/ui.js"></script>
<script src="js/exportx.js"></script>
<script src="js/share.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
