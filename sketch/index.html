<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<title>사고약도</title>
<meta name="description" content="손가락으로 그리는 사고약도 — 갤러리 사진 또는 도로 도면 위에 차량·충돌·진행방향을 배치해 PNG·A4로 저장" />
<meta name="theme-color" content="#F4F7FB" id="metaTheme" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="사고약도" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="stylesheet" href="app.css" />
</head>
<body data-theme="A" data-mode="road" data-btnsz="md">

<div id="appShell">
  <!-- 상단 — 딱 1줄: 로고 · [도로|사진] · (사진 조정) -->
  <header id="topBarWrap">
    <div id="topbar">
      <button id="brandTap" class="brand" type="button" aria-label="사고약도">
        <span class="bmark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 19.2 9.4 5.2l5.2 8.6 5.4-3.6-2 9z"/><circle cx="9.4" cy="5.2" r="2.1"/></svg>
        </span>
        <span class="bname">사고약도</span>
      </button>

      <div id="modeSeg" role="tablist" aria-label="약도 배경">
        <button type="button" role="tab" data-mode="road" class="on" aria-selected="true">
          <svg viewBox="0 0 24 24"><path d="M7.6 3.6v16.8M16.4 3.6v16.8" stroke-dasharray="4 3.4"/><path d="M3.4 4.6h17.2M3.4 19.4h17.2"/></svg>
          <span>도로</span>
        </button>
        <button type="button" role="tab" data-mode="photo" aria-selected="false">
          <svg viewBox="0 0 24 24"><rect x="3.2" y="5" width="17.6" height="14" rx="2.6"/><circle cx="8.6" cy="9.8" r="1.9"/><path d="m4.4 17.2 4.9-4 4.6 4.1 2.7-2.4 3 3.1"/></svg>
          <span>사진</span>
        </button>
      </div>

      <!-- 사진 모드에 사진이 올라와 있을 때만 — 켜면 캔버스 위 1줄 조정 바가 뜬다 -->
      <button id="btnPhotoAdj" class="gl adj" type="button" aria-pressed="false" hidden>
        <svg viewBox="0 0 24 24"><rect x="4.6" y="10.6" width="14.8" height="9.4" rx="2.6"/><path d="M8.2 10.6V8.1a3.8 3.8 0 0 1 7-2.1"/></svg>
        <em id="photoAdjTxt">사진 조정</em>
      </button>
    </div>
  </header>

  <!-- 중앙 순수 약도 캔버스 -->
  <main id="stage">
    <div id="roadLayer" hidden></div>
    <svg id="board" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <!-- 사진 레이어 — 확대·회전·이동 변환은 이 그룹에만 걸린다(요소는 영향 없음) -->
      <g id="photoWrap" visibility="hidden">
        <image id="photoImg" href="" preserveAspectRatio="xMidYMid slice" x="0" y="0" width="390" height="640" visibility="hidden"></image>
      </g>
      <!-- 요소 레이어 — 화면 좌표 그대로(사진 배율·각도와 무관) -->
      <g id="artLayer"></g>
    </svg>

    <!-- 사진 조정 — 평소 숨김. 켰을 때만 캔버스 위 슬림 1줄 -->
    <div id="photoBar" hidden>
      <button id="btnZoomOut" class="zbtn" type="button" aria-label="사진 축소 (100%보다 작게는 줄일 수 없어요)">
        <svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg>
      </button>
      <input id="photoZoom" type="range" min="100" max="500" step="5" value="100" aria-label="사진 크기 (100%는 여백 없이 꽉 찬 크기)" />
      <button id="btnZoomIn" class="zbtn" type="button" aria-label="사진 확대">
        <svg viewBox="0 0 24 24"><path d="M6 12h12M12 6v12"/></svg>
      </button>
      <span id="photoZoomVal" aria-live="off">100%</span>
      <button id="btnPhotoFit" class="pchip" type="button" aria-label="사진을 불러온 그대로(100%) 되돌리기">원본</button>
      <button id="capSwap" class="pchip" type="button">교체</button>
      <button id="capPaste" class="pchip" type="button" aria-label="클립보드에 복사한 사진 붙여넣기">붙이기</button>
      <button id="capEdit" class="zbtn" type="button" aria-label="사진을 다시 맞추기 — 위치·크기·각도 편집 창 열기">
        <svg viewBox="0 0 24 24"><path d="M4.6 8.4h14.8M4.6 15.6h14.8"/><circle cx="9.4" cy="8.4" r="2.2"/><circle cx="15" cy="15.6" r="2.2"/></svg>
      </button>
      <button id="capDone" class="pchip on" type="button">완료</button>
    </div>

    <div id="emptyPhoto" hidden>
      <div class="pickwrap">
        <button id="btnPickPhoto" class="pickcta" type="button">
          <svg viewBox="0 0 24 24"><rect x="3.2" y="5" width="17.6" height="14" rx="2.6"/><circle cx="8.6" cy="9.8" r="1.9"/><path d="m4.4 17.2 4.9-4 4.6 4.1 2.7-2.4 3 3.1"/></svg>
          <b>갤러리에서 사진 불러오기</b>
          <span>사진을 깔고 그 위에 차량·충격·진행방향을 그립니다</span>
        </button>
        <button id="btnPastePhoto" class="pickpaste" type="button">
          <svg viewBox="0 0 24 24"><path d="M9 4.8h6v2.4H9z"/><rect x="5.6" y="4.4" width="12.8" height="15.2" rx="2.4"/><path d="M9.2 11.6h5.6M9.2 15h3.6"/></svg>
          <b>클립보드에서 붙여넣기</b>
        </button>
      </div>
    </div>

    <svg id="holdRing" viewBox="0 0 56 56" hidden aria-hidden="true"><circle class="bg" cx="28" cy="28" r="22"/><circle class="fg" cx="28" cy="28" r="22"/></svg>
    <div id="sel">
      <div class="selbox"></div>
      <button class="hnd rot" type="button" aria-label="회전"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20.4 4.4v4.2h-4.2"/></svg></button>
      <button class="hnd size" type="button" aria-label="크기"><svg viewBox="0 0 24 24"><path d="M4.6 19.4 19.4 4.6"/><path d="M13 4.6h6.4v6.4"/><path d="M4.6 13v6.4H11"/></svg></button>
      <button class="hnd delx" id="btnSelDel" type="button" aria-label="선택한 요소 삭제"><svg viewBox="0 0 24 24"><path d="M6.6 6.6 17.4 17.4M17.4 6.6 6.6 17.4"/></svg></button>
      <div class="angle" hidden>0°</div>
    </div>
    <div id="chipRot" hidden>0°</div>

    <!-- 그리기 — 하단 독 위 1줄 플로팅 바 (자유선·화살표·메모 + 색 + 완료) -->
    <div id="drawBar" hidden>
      <div class="dseg" id="drawTools" role="group" aria-label="그리기 도구">
        <button type="button" data-tool="pen" class="on">자유선</button>
        <button type="button" data-tool="vec">화살표</button>
        <button type="button" data-tool="memo">메모</button>
      </div>
      <div class="ddots" id="drawColors" role="group" aria-label="펜 색"></div>
      <button id="drawDone" class="ddone" type="button">완료</button>
    </div>

    <div id="toast" hidden></div>
  </main>

  <!-- 하단 — 선택 패널 + 5~6개 핵심 버튼 독 -->
  <footer id="bottomWrap">
    <div id="selBar" hidden>
      <div class="sbr sbrRoles" id="sbRolesRow">
        <div class="roles" id="roleSeg"></div>
      </div>
      <div class="sbr sbrMain">
        <div class="sbseg" id="sbMode" role="group" aria-label="조절 대상">
          <button type="button" data-smode="size" class="on" aria-pressed="true">크기</button>
          <button type="button" data-smode="label" id="sbModeLab" aria-pressed="false">글씨</button>
        </div>
        <button class="sb arrowbtn" id="btnPenArrow" data-act="arrow" type="button" hidden>↗ 화살표</button>
        <button class="sb" data-act="zin" type="button" aria-label="작게">−</button>
        <input id="sbRange" class="sbrange" type="range" min="0" max="1000" step="1" value="0" aria-label="요소 조절 슬라이더" />
        <button class="sb" data-act="zout" type="button" aria-label="크게">+</button>
        <span class="sbval" id="sbVal" aria-live="off">1.00×</span>
        <button class="sb" data-act="dup" type="button" aria-label="복제">
          <svg viewBox="0 0 24 24"><rect x="8.4" y="8.4" width="11.2" height="11.2" rx="2.4"/><path d="M15.6 5.4H6.6a1.2 1.2 0 0 0-1.2 1.2v9"/></svg>
        </button>
        <button class="sb danger" data-act="del" type="button" aria-label="삭제">
          <svg viewBox="0 0 24 24"><path d="M4.8 6.8h14.4M9.4 6.8V4.4h5.2v2.4M6.6 6.8l.9 12.4h9l.9-12.4"/><path d="M10.2 10.4v5.4M13.8 10.4v5.4"/></svg>
        </button>
      </div>
    </div>

    <div id="dock">
      <button class="dk" type="button" data-cat="road">
        <svg viewBox="0 0 24 24"><path d="M7.6 3.6v16.8M16.4 3.6v16.8" stroke-dasharray="4 3.4"/><path d="M3.4 4.6h17.2M3.4 19.4h17.2"/></svg>
        <span>도로·상황</span>
      </button>
      <button class="dk" type="button" data-cat="car">
        <svg viewBox="0 0 24 24"><path d="M5.4 15.1v-2.4l1.5-3.8a2.2 2.2 0 0 1 2-1.4h6.2a2.2 2.2 0 0 1 2 1.4l1.5 3.8v2.4"/><path d="M4.2 15.1h15.6"/><circle cx="8" cy="17.1" r="1.6"/><circle cx="16" cy="17.1" r="1.6"/></svg>
        <span>차량</span>
      </button>
      <button class="dk" type="button" data-cat="person">
        <svg viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.4"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.4"/><circle cx="16.8" cy="16.8" r="3.4"/></svg>
        <span>요소</span>
      </button>
      <button class="dk" type="button" id="btnDraw">
        <svg viewBox="0 0 24 24"><path d="M16.4 4.6 19.4 7.6 9.2 17.8 4.8 19.2l1.4-4.4z"/><path d="M14.2 6.8 17.2 9.8"/></svg>
        <span>그리기</span>
      </button>
      <button class="dk act" type="button" id="btnUndo" aria-label="실행취소">
        <svg viewBox="0 0 24 24"><path d="M9.2 14.6 4.4 9.8l4.8-4.8"/><path d="M4.4 9.8h9.2a5.9 5.9 0 0 1 0 11.8H9.6"/></svg>
        <span>되돌리기</span>
      </button>
      <button class="dk save" type="button" id="btnSave">
        <svg viewBox="0 0 24 24"><path d="M12 4.2v10.4"/><path d="m7.8 10.4 4.2 4.2 4.2-4.2"/><path d="M4.6 18.6h14.8"/></svg>
        <span>저장</span>
      </button>
    </div>
  </footer>
</div>

<!-- 피커 시트 — 차량 · 사람 · 파손·충격 · 신호·도로 를 탭 한 곳에서 -->
<section id="sheet" aria-hidden="true">
  <div class="sheetwrap">
    <div class="grip"></div>
    <header>
      <div>
        <h2 id="sheetTitle">차량</h2>
        <p id="sheetSub">항목을 눌러 약도에 놓으세요</p>
      </div>
      <button id="sheetClose" class="xbtn" type="button" aria-label="닫기">✕</button>
    </header>
    <div id="sheetTabs" class="stabs" role="tablist" aria-label="요소 분류"></div>
    <div id="sheetRole" class="roles big" hidden></div>
    <div id="sheetBody"></div>
  </div>
</section>

<!-- 모달(저장·테마·PNG) -->
<div id="modal" hidden>
  <div class="mscrim" data-close="1"></div>
  <div class="mwrap" id="modalBody"></div>
</div>

<!-- 사진 크기·영역 맞춰 붙여넣기 (갤러리 · 클립보드 · 공유 3경로 공통) -->
<div id="impPhoto" hidden>
  <div class="impscrim" id="impScrim"></div>
  <div class="impwrap" role="dialog" aria-modal="true" aria-label="사진 크기·영역 맞춰 붙여넣기">
    <header class="imphead">
      <div>
        <h3>사진 크기·영역 맞춰 붙여넣기</h3>
        <p>끌어서 위치 · 두 손가락(휠)로 크기 · 각도 · <b>100%</b>는 여백 없이 꽉 찬 크기</p>
      </div>
      <button id="impClose" class="xbtn" type="button" aria-label="닫기">✕</button>
    </header>
    <div class="impframe" id="impFrame">
      <div class="impbox" id="impBox">
        <canvas id="impCanvas" aria-label="사진 미리보기"></canvas>
        <span class="imppct" id="impPct">100%</span>
        <span class="improt" id="impRotVal">0°</span>
      </div>
    </div>
    <div class="impctl">
      <div class="impquick">
        <button type="button" data-q="cover">꽉 채우기</button>
        <button type="button" data-q="rot">90° 회전</button>
      </div>
      <div class="impzoom improw">
        <b class="implab">크기</b>
        <button id="impMinus" class="zbtn" type="button" aria-label="작게">−</button>
        <input id="impZoom" type="range" min="100" max="400" step="1" value="100" aria-label="사진 크기 (100%는 여백 없이 꽉 찬 크기)" />
        <button id="impPlus" class="zbtn" type="button" aria-label="크게">＋</button>
        <span id="impZoomVal" class="impval" aria-live="off">100%</span>
      </div>
      <div class="impangle improw">
        <b class="implab">각도</b>
        <button id="impRotMinus" class="zbtn" type="button" aria-label="각도 줄이기">−</button>
        <input id="impRot" type="range" min="0" max="359" step="1" value="0" aria-label="사진 각도" />
        <button id="impRotPlus" class="zbtn" type="button" aria-label="각도 늘리기">＋</button>
        <span id="impAngVal" class="impval" aria-live="off">0°</span>
      </div>
      <p class="impnote" id="impFitNote">100%는 여백 없이 꽉 찬 크기 — 더 키우면 가장자리가 잘려요</p>
      <div class="impacts">
        <button id="impCancel" class="btn ghost" type="button">취소</button>
        <button id="impApply" class="btn primary" type="button">이대로 붙여넣기</button>
      </div>
    </div>
  </div>
</div>

<!-- 메모 입력 -->
<div id="memoWrap" hidden>
  <div class="memopanel">
    <input id="memoInput" type="text" maxlength="30" placeholder="메모 (예: 1차로 추돌)" />
    <button id="memoOk" type="button">확인</button>
  </div>
</div>

<div id="printArea" aria-hidden="true"></div>
<input id="fileInput" type="file" accept="image/*" hidden />

<script src="js/art3.js"></script>
<script src="js/elements.js"></script>
<script src="js/roads.js"></script>
<script src="js/sprites.js"></script>
<script src="js/core.js"></script>
<script src="js/viewx.js"></script>
<script src="js/objs.js"></script>
<script src="js/ui.js"></script>
<script src="js/importx.js"></script>
<script src="js/exportx.js"></script>
<script src="js/share.js"></script>
<script src="js/boot.js"></script>
</body>
</html>
